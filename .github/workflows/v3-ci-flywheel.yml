# ADR-0268 — CI stanza for the autonomous skill-promotion flywheel smoke.
#
# Per `feedback-always-wire-tests-into-cicd`: the round-trip smoke is wired into
# the standard runner (scripts/test-acceptance.sh, adr0268-flywheel check) AND
# here. The smoke drives the live loop end-to-end against an installed CLI:
# hooks post-task x3 (record episodes w/ task_type) -> hooks session-end
# (promote via routeSessionOp 'end' consolidation) -> hooks pre-task (retrieve),
# asserting the episodes, the promoted skill, and that a subsequent same-type
# task retrieves it. Single job (no benchmark/platform matrix). Per
# `feedback-no-tail-tests`: the smoke writes its log to SMOKE_LOG_DIR.

name: ADR-0268 skill-promotion flywheel

on:
  push:
    branches: [main]
    paths:
      - 'forks/agentdb/src/controllers/SkillLibrary.ts'
      - 'forks/agentdb/src/controllers/ReflexionMemory.ts'
      - 'forks/agentdb/src/archivist/handlers/agentdb/reflexion-store.ts'
      - 'forks/ruflo/v3/@claude-flow/cli/src/learning/derive-task-type.ts'
      - 'forks/ruflo/v3/@claude-flow/cli/src/mcp-tools/hooks-tools.ts'
      - 'forks/ruflo/v3/@claude-flow/cli/src/mcp-tools/agent-execute-core.ts'
      - 'forks/ruflo/v3/@claude-flow/cli/src/memory/memory-router.ts'
      - 'scripts/smoke-adr0268-flywheel.mjs'
      - 'lib/acceptance-adr0268-checks.sh'
  pull_request:
    paths:
      - 'forks/agentdb/src/controllers/SkillLibrary.ts'
      - 'forks/agentdb/src/controllers/ReflexionMemory.ts'
      - 'forks/ruflo/v3/@claude-flow/cli/src/learning/derive-task-type.ts'
      - 'forks/ruflo/v3/@claude-flow/cli/src/mcp-tools/hooks-tools.ts'
      - 'scripts/smoke-adr0268-flywheel.mjs'
      - 'lib/acceptance-adr0268-checks.sh'

env:
  REGISTRY: http://localhost:4873
  CLI_PKG: '@sparkleideas/ruflo'
  SMOKE_LOG_DIR: ${{ github.workspace }}/smoke-logs

jobs:
  flywheel-roundtrip:
    name: skill-promotion flywheel round-trip (ADR-0268)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start local Verdaccio + publish fork packages
        run: |
          set -e
          mkdir -p "${SMOKE_LOG_DIR}"
          bash scripts/ruflo-publish.sh 2>&1 | tee "${SMOKE_LOG_DIR}/publish.log"

      - name: Run ADR-0268 flywheel smoke via fast runner
        run: |
          set -e
          mkdir -p "${SMOKE_LOG_DIR}"
          bash scripts/test-acceptance-fast.sh adr0268 2>&1 | tee "${SMOKE_LOG_DIR}/adr0268.log"

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-flywheel
          path: ${{ env.SMOKE_LOG_DIR }}
