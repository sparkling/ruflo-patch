# ADR-0317 — CI stanza for the system_health storage-honesty fix.
#
# Per `feedback-always-wire-tests-into-cicd`: wired into the standard runner
# (scripts/test-acceptance.sh + scripts/test-acceptance-fast.sh, adr0317 group)
# AND here. Validates the INSTALLED CLI: with a real store present
# (`.swarm/memory.db`), `system_health` reports memory:healthy (M1); the shipped
# artifact probes a candidate SET of >=3 store paths (M2 arch-guard). Goes GREEN
# only after the fork system-tools.ts candidate-set fix ships. Per
# `feedback-no-tail-tests` the run writes its log to SMOKE_LOG_DIR.

name: ADR-0317 system_health storage honesty

on:
  push:
    branches: [main]
    paths:
      - 'forks/ruflo/v3/@claude-flow/cli/src/mcp-tools/system-tools.ts'
      - 'lib/acceptance-adr-syshealth-checks.sh'
      - '.github/workflows/v3-ci-adr0317-syshealth.yml'
  pull_request:
    paths:
      - 'forks/ruflo/v3/@claude-flow/cli/src/mcp-tools/system-tools.ts'
      - 'lib/acceptance-adr-syshealth-checks.sh'
      - '.github/workflows/v3-ci-adr0317-syshealth.yml'

env:
  REGISTRY: http://localhost:4873
  CLI_PKG: '@sparkleideas/ruflo'
  SMOKE_LOG_DIR: ${{ github.workspace }}/smoke-logs

jobs:
  syshealth-storage-honesty:
    name: system_health probes the real store (ADR-0317)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Start local Verdaccio + publish fork packages
        run: |
          set -e
          mkdir -p "${SMOKE_LOG_DIR}"
          bash scripts/ruflo-publish.sh 2>&1 | tee "${SMOKE_LOG_DIR}/publish.log"

      - name: Run ADR-0317 system_health checks via fast runner
        run: |
          set -e
          mkdir -p "${SMOKE_LOG_DIR}"
          bash scripts/test-acceptance-fast.sh adr0317 2>&1 | tee "${SMOKE_LOG_DIR}/adr0317.log"

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-adr0317-syshealth
          path: ${{ env.SMOKE_LOG_DIR }}
